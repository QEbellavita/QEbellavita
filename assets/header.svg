<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="QEbellavita, applied AI, reproducible research, and reliable engineering">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#101b2d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
      <animate attributeName="x1" values="0;0.25;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;0.75;1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="280" fill="url(#background)"/>
    <circle cx="600" cy="130" r="330" fill="url(#halo)">
      <animate attributeName="r" values="280;350;280" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.65;1;0.65" dur="7s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#60a5fa" stroke-opacity="0.07" stroke-width="1">
      <path d="M0 56H1200M0 112H1200M0 168H1200M0 224H1200"/>
      <path d="M120 0V280M240 0V280M360 0V280M480 0V280M600 0V280M720 0V280M840 0V280M960 0V280M1080 0V280"/>
    </g>

    <path d="M0 222 H130 L158 210 L180 224 L205 222 H330 L354 206 L376 224 L400 222 H520 L548 178 L576 238 L606 122 L636 232 L664 190 L690 222 H810 L836 207 L858 224 L884 222 H1010 L1036 202 L1060 224 L1084 222 H1200"
          fill="none" stroke="#2563eb" stroke-opacity="0.22" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M0 222 H130 L158 210 L180 224 L205 222 H330 L354 206 L376 224 L400 222 H520 L548 178 L576 238 L606 122 L636 232 L664 190 L690 222 H810 L836 207 L858 224 L884 222 H1010 L1036 202 L1060 224 L1084 222 H1200"
          fill="none" stroke="url(#signal)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"
          pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="1000">
      <animate attributeName="stroke-dashoffset" values="1000;0;0" keyTimes="0;0.65;1" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.35;1;1;0.35" keyTimes="0;0.15;0.85;1" dur="5.5s" repeatCount="indefinite"/>
    </path>

    <text x="50%" y="112" text-anchor="middle" fill="#f8fafc" font-family="Arial" font-size="52" font-weight="700" letter-spacing="1">QEbellavita</text>
    <text x="50%" y="154" text-anchor="middle" fill="#93c5fd" font-family="Arial" font-size="17" font-weight="600" letter-spacing="2">APPLIED AI  •  RESEARCH  •  ENGINEERING</text>
  </g>
</svg>
