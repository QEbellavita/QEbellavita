<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-gated signal pipeline</title>
  <desc id="desc">Signals pass through validation and independent evidence checks. The system returns a measured result only when the evidence is sufficient; otherwise it abstains.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#151D2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="980" height="300" rx="18" fill="url(#bg)"/>
  <text x="48" y="48" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Evidence before inference</text>
  <text x="48" y="76" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14">A result is returned only when the available evidence earns it.</text>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif">
    <rect x="48" y="126" width="170" height="92" rx="14" fill="#172235" stroke="#334155"/>
    <text x="133" y="165" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="700">Signals</text>
    <text x="133" y="190" text-anchor="middle" fill="#94A3B8" font-size="13">real-world inputs</text>
    <rect x="286" y="126" width="170" height="92" rx="14" fill="#172235" stroke="#334155"/>
    <text x="371" y="165" text-anchor="middle" fill="#BFDBFE" font-size="16" font-weight="700">Validation</text>
    <text x="371" y="190" text-anchor="middle" fill="#94A3B8" font-size="13">quality and freshness</text>
    <rect x="524" y="126" width="170" height="92" rx="14" fill="#211D3A" stroke="#5B4B9A"/>
    <text x="609" y="165" text-anchor="middle" fill="#DDD6FE" font-size="16" font-weight="700">Evidence gate</text>
    <text x="609" y="190" text-anchor="middle" fill="#A5B4FC" font-size="13">measured support</text>
    <rect x="762" y="108" width="170" height="58" rx="14" fill="#17352F" stroke="#3B8B78"/>
    <text x="847" y="143" text-anchor="middle" fill="#BBF7D0" font-size="15" font-weight="700">Measured result</text>
    <rect x="762" y="178" width="170" height="58" rx="14" fill="#33261D" stroke="#9A6B3A"/>
    <text x="847" y="213" text-anchor="middle" fill="#FED7AA" font-size="15" font-weight="700">Abstain</text>
  </g>
  <g fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round">
    <path d="M218 172H276"/>
    <path d="M456 172H514"/>
    <path d="M694 172H750"/>
    <path d="M730 172H744V137H750"/>
    <path d="M730 172H744V207H750"/>
  </g>
  <g fill="#A78BFA">
    <path d="m270 165 12 7-12 7z"/>
    <path d="m508 165 12 7-12 7z"/>
    <path d="m744 130 12 7-12 7z"/>
    <path d="m744 200 12 7-12 7z"/>
  </g>
</svg>
